[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "dumansizelecek"
version = "1.0.0"
description = "Dumansız Gelecek - Android WebView Wrapper"
authors = [{name = "Dumansız Gelecek", email = "info@dumansiz.org"}]
requires-python = ">=3.8"
dependencies = [
    "pyjnius",
    "android",
]

[tool.briefcase]
project_name = "Dumansız Gelecek"
bundle = "org.dumansiz"
url = "https://dumansiz.org"
license = "Apache 2.0"
author = "Dumansız Gelecek"
author_email = "info@dumansiz.org"
description = "Android uygulaması - Dumansız Gelecek"

[tool.briefcase.app.dumansizelecek]
formal_name = "Dumansız Gelecek"
description = "Android uygulaması - Dumansız Gelecek"
sources = ["src"]
module_name = "dumansizelecek"
startup_method = "app.main"
requires = [
    "pyjnius",
    "android",
]

[tool.briefcase.app.dumansizelecek.android]
permission = ["INTERNET", "ACCESS_NETWORK_STATE"]
orientation = "portrait"
min_sdk_version = 21
target_sdk_version = 31
