name: Build APK

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libffi-dev \
          libssl-dev \
          openjdk-17-jdk \
          gradle \
          git \
          cython \
          python3-dev \
          libncurses5 \
          unzip \
          wget \
          autoconf \
          automake \
          libtool \
          pkg-config \
          zlib1g-dev
    
    - name: Set up Android SDK
      run: |
        mkdir -p ~/Android/Sdk/cmdline-tools
        cd ~/Android/Sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        
    - name: Accept Android Licenses
      run: |
        yes | ~/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/Android/Sdk "platforms;android-31" "build-tools;31.0.0" "ndk;25.1.8937393"
    
    - name: Set up environment variables
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$HOME/Android/Sdk/ndk/25.1.8937393" >> $GITHUB_ENV
        echo "PATH=$HOME/Android/Sdk/cmdline-tools/latest/bin:$HOME/Android/Sdk/tools:$HOME/Android/Sdk/platform-tools:$PATH" >> $GITHUB_ENV
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install buildozer cython kivy
    
    - name: Build APK
      run: |
        buildozer android release
        
    - name: Find APK
      id: find_apk
      run: |
        APK_PATH=$(find . -name "*.apk" -type f | head -1)
        if [ -z "$APK_PATH" ]; then
          echo "APK not found!"
          find . -name "*.apk" -o -name "bin" -o -name "build"
          exit 1
        fi
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "Found APK: $APK_PATH"
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: dumansizelecek-apk
        path: ${{ steps.find_apk.outputs.apk_path }}
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ steps.find_apk.outputs.apk_path }}
        body: |
          # 📱 Dumansız Gelecek APK Release
          
          Kivy + Buildozer ile oluşturulan Android uygulaması.
          
          ## 📥 Kurulum
          1. APK dosyasını indir
          2. Android cihazına aktar
          3. Bilinmeyen kaynaktan yükleme izni ver
          4. APK'yı yükle
          5. Uygulamayı başlat
          
          ## ✨ Özellikler
          - WebView tabanlı
          - Tüm Android 5.0+ cihazlarla uyumlu
          - Responsive tasarım
          - ~50 MB boyutunda
          
          ## 🌐 Web Sitesi
          https://tolgauysal.github.io/dumansiz-gelecek/
          
          ## 📞 Sorun?
          GitHub Issues'da bildir: https://github.com/tolgauysal/dumansiz-gelecek/issues
          
          ---
          **Sürüm**: ${{ github.ref_name }}
          **Yayın Tarihi**: 2 Haziran 2026
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
